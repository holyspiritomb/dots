# Make mouse useful in copy mode
setw -g mouse on
# setw -g mode-keys vi
run-shell "powerline-daemon -q"
source "/usr/share/powerline/bindings/tmux/powerline.conf"
set-option -sg escape-time 10
# set -g default-terminal "rxvt-unicode-256color"
set -g default-terminal "tmux-256color"
# set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",rxvt-unicode-256color:Tc,tmux-256color:Tc,xterm-256color:Tc"
set -g default-shell /usr/bin/zsh

# keybinds {{{
bind r source-file ~/.tmux.conf
bind -n ñ send-key "\~"
bind -n ß send-key "#"
bind -n ò send-key `
bind -n ô send-key "\^"
bind -n € send-key "\$"
bind -n ¹ send-key F1
bind -n ² send-key F2
bind -n ³ send-key F3
bind -n ⁴ send-key F4
bind -n ⁵ send-key F5
bind -n ⁶ send-key F6
bind -n ⁷ send-key F7
bind -n ⁸ send-key F8
bind -n ⁹ send-key F9
bind -n ⁰ send-key F10
bind -n ⅒ send-key F11
bind -n ½ send-key F12
bind -n … send-key Escape
bind -n — send-key Tab
# bind-key -T copy-mode Enter cancel
# }}}

# tmux-sensible options {{{
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
# set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
# set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 5000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
# set -g status-interval 5

# Upgrade $TERM
# set -g default-terminal "screen-256color"

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
# set -g status-keys vi

# Focus events enabled for terminals that support them
# set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Easier and faster switching between next/prev window
# bind C-p previous-window
# bind C-n next-window

# Source .tmux.conf as suggested in `man tmux`
# bind R source-file '~/.tmux.conf'
# }}}

# rose-pine options {{{
set -g @rose_pine_variant 'moon' # Options are 'main', 'moon' or 'dawn'

# optional extra modules {{{
# set -g @rose_pine_host 'on' # Enables hostname in the status bar
set -g @rose_pine_date_time '%-I:%M %p' # It accepts the date UNIX command format (man date for info)
# set -g @rose_pine_user 'on' # Turn on the username component in the statusbar
# set -g @rose_pine_directory 'on' # Turn on the current folder component in the status bar
# }}}

set -g @rose_pine_bar_bg_disable 'on' # Disables background color, for transparent terminal emulators
# If @rose_pine_bar_bg_disable is set to 'on', uses the provided value to set the background color
# It can be any of the on tmux (named colors, 256-color set, `default` or hex colors)
# See more on http://man.openbsd.org/OpenBSD-current/man1/tmux.1#STYLES
set -g @rose_pine_bar_bg_disabled_color_option 'default'
# set -g @rose_pine_only_windows 'on'
set -g @rose_pine_disable_active_window_menu 'on' # Disables the menu that shows the active window on the left

set -g @rose_pine_default_window_behavior 'on' # Forces tmux default window list behaviour
set -g @rose_pine_show_current_program 'on' # Forces tmux to show the current running program as window name
# set -g @rose_pine_show_pane_directory 'on' # Forces tmux to show the current directory as window name

# separators: {{{
set -g @rose_pine_left_separator '  ' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator '  ' # Accepts both normal chars & nerdfont icons
set -g @rose_pine_field_separator ' | ' # Again, 1-space padding, it updates with prefix + I
# }}}

# icons {{{
# These are not padded
set -g @rose_pine_session_icon ' ' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '󰕰 ' # Changes the default icon to the left of the active window name
# set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon ' ' # Changes the default icon to the right of the hostname
# set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname
set -g @rose_pine_date_time_icon '' # Changes the default icon to the right of the date module
set -g @rose_pine_window_status_separator "  " # Changes the default icon that appears between window names
# }}}

# Very beta and specific opt-in settings, tested on v3.2a, look at issue #10 {{{
# set -g @rose_pine_prioritize_windows 'on' # Disables the right side functionality in a certain window count / terminal width
# set -g @rose_pine_width_to_hide '80' # Specify a terminal width to toggle off most of the right side functionality
# set -g @rose_pine_window_count '5' # Specify a number of windows, if there are more than the number, do the same as width_to_hide
# }}}

# Add to the beginning / end of the left and right sections your own {{{
set -g @rose_pine_status_left_prepend_section '#{tmux_mode_indicator} '
# set -g @rose_pine_status_left_append_section 'It works'
# set -g @rose_pine_status_right_prepend_section 'with normal text'
# set -g @rose_pine_status_right_append_section ' too '
# }}}
# }}}

# mode indicator options {{{
# set -ag status-right '#{tmux_mode_indicator}'
# prompt to display when tmux prefix key is pressed
set -g @mode_indicator_prefix_prompt '  '
set -g @mode_indicator_prefix_mode_style 'bg=#232136,fg=#e0def4'
# prompt to display when tmux is in normal mode
set -g @mode_indicator_empty_prompt ' ♥ '
set -g @mode_indicator_empty_mode_style 'bg=#232136,fg=#e0def4'
# prompt to display when tmux is in copy mode
set -g @mode_indicator_copy_prompt '  '
set -g @mode_indicator_copy_mode_style 'bg=#232136,fg=#e0def4'
# prompt to display when tmux has synchronized panes
set -g @mode_indicator_sync_prompt '  '
set -g @mode_indicator_sync_mode_style 'bg=#232136,fg=#e0def4'
# # prompt to display instead of default mode indicators
# set @mode_indicator_custom_prompt ' ---- '
# # style values for custom prompt
# set @mode_indicator_custom_mode_style 'default'
# To revert back to the default mode indicators, unset those options:
# set -u @mode_indicator_custom_prompt
# set -u @mode_indicator_custom_mode_style
# }}}

# plugins {{{
set-option -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'trevarj/tmux-open-nvim'
set -g @plugin 'jaclu/tmux-menus'
# set -g @plugin 'rose-pine/tmux'
# set -g @plugin 'trevarj/tmux-open-nvim'
set-option -g @plugin 'b0o/tmux-autoreload'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'MunifTanjim/tmux-mode-indicator'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# }}}
